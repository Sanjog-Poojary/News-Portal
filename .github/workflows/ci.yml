name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install client dependencies
        run: npm ci
        working-directory: client

      - name: Build client
        run: npm run build
        working-directory: client

      - name: Install server dependencies
        run: npm ci
        working-directory: server

      - name: Check server syntax
        shell: bash
        run: |
          find server/src -name '*.js' -print0 | xargs -0 -n1 node --check

  publish-containers:
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push server image
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: |
            ghcr.io/sanjog-poojary/news-portal-server:latest
            ghcr.io/sanjog-poojary/news-portal-server:${{ github.sha }}
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server

      - name: Build and push client image
        uses: docker/build-push-action@v6
        with:
          context: ./client
          push: true
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || '/api' }}
            VITE_SOCKET_URL=${{ vars.VITE_SOCKET_URL || '' }}
          tags: |
            ghcr.io/sanjog-poojary/news-portal-client:latest
            ghcr.io/sanjog-poojary/news-portal-client:${{ github.sha }}
          cache-from: type=gha,scope=client
          cache-to: type=gha,mode=max,scope=client

  deploy:
    runs-on: ubuntu-latest
    needs: publish-containers
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    env:
      DEPLOY_HOOK_URL: ${{ secrets.DEPLOY_HOOK_URL || secrets.RENDER_DEPLOY_HOOK_URL }}
    steps:
      - name: Trigger deployment webhook
        if: env.DEPLOY_HOOK_URL != ''
        run: |
          echo "Triggering deployment webhook..."
          curl --fail --silent --show-error \
            --request POST \
            "$DEPLOY_HOOK_URL"
          echo "Deployment triggered successfully!"

      - name: Deployment status notice
        if: env.DEPLOY_HOOK_URL == ''
        run: |
          echo "::notice ::Containers were successfully built and pushed to GitHub Container Registry (ghcr.io)."
          echo "To automate live deployment to your hosting service (e.g. Render, Railway), set DEPLOY_HOOK_URL or RENDER_DEPLOY_HOOK_URL in repository Secrets."
